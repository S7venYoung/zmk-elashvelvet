name: Build Cube keyboard peripherals
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
      - run: west init -l config && west update --narrow && west zephyr-export
      - name: Normalize public behavior names
        run: python3 scripts/patch_behavior_names.py dependencies
      - name: Test reset bootloader transition
        run: python3 scripts/test_settings_reset_bootloader.py
      - name: Make settings reset return to bootloader
        run: python3 scripts/patch_settings_reset_bootloader.py dependencies/zmk/app/src/settings/reset_settings_on_start.c
      - name: Test left cat theme
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc/display/themes/cat src/display/themes/cat/tests/test_cat_display.c -o /tmp/test-cat
          /tmp/test-cat
      - name: Test right system dashboard
        run: |
          cc -std=c11 -Wall -Wextra -Werror src/display/tests/test_dashboard.c -o /tmp/test-dashboard
          /tmp/test-dashboard
          python3 scripts/test_cube_system_relay.py dependencies/zmk
      - run: west zmk-build -d ./build -q
      - name: Verify DYA central capabilities
        run: python3 scripts/verify_dya_features.py build --peripheral-only
      - name: Verify right system dashboard and memory LCD
        run: |
          grep -qx 'CONFIG_VELVET_CUBE_SYSTEM_DISPLAY=y' build/velvet_right_cube/zephyr/.config
          grep -qx 'CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y' build/velvet_right_cube/zephyr/.config
          grep -qx 'CONFIG_ZMK_BACKLIGHT_ON_START=y' build/velvet_right_cube/zephyr/.config
          grep -qx 'CONFIG_ZMK_SPLIT_RELAY_EVENT_TYPE_NAME_LEN=32' build/velvet_right_cube/zephyr/.config
          find build/velvet_right_cube -name cube_system_screen.c.obj -print -quit | grep -q .
          grep -q serial-vcom-inversion build/velvet_right_cube/zephyr/zephyr.dts
          grep -q vcom_toggle_thread build/velvet_right_cube/zephyr/zmk.map
      - name: Verify settings reset returns to bootloader
        run: python3 scripts/verify_settings_reset_bootloader.py
      - name: Verify left cat theme and memory LCD
        run: |
          grep -qx 'CONFIG_VELVET_CUBE_CAT_DISPLAY=y' build/velvet_left_cube/zephyr/.config
          grep -qx '# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN is not set' build/velvet_left_cube/zephyr/.config
          grep -qx 'CONFIG_ZMK_BACKLIGHT_ON_START=y' build/velvet_left_cube/zephyr/.config
          find build/velvet_left_cube -name cat_display.c.obj -print -quit | grep -q .
          grep -q serial-vcom-inversion build/velvet_left_cube/zephyr/zephyr.dts
          grep -q vcom_toggle_thread build/velvet_left_cube/zephyr/zmk.map
      - name: Verify Cube discovery module is linked into both halves
        shell: bash
        run: |
          for half in velvet_left_cube velvet_right_cube; do
            test -s "build/$half/zephyr/zmk.elf"
            grep -q 'cube_identity.c' "build/$half/build.ninja"
            grep -q 'cube_identity' "build/$half/zephyr/zephyr_pre0.map"
          done
      - name: Report effective configuration and RAM allocations
        if: always()
        shell: bash
        run: |
          for cfg in build/*/zephyr/.config; do
            echo "=== $cfg ==="
            grep -E '^CONFIG_(BT_BUF_(ACL_TX_COUNT|EVT_RX_COUNT)|BT_L2CAP_TX_BUF_COUNT|BT_MAX_CONN|ZMK_BEHAVIORS_QUEUE_SIZE|LV_Z_MEM_POOL_SIZE|LV_Z_VDB_SIZE|LV_Z_BITS_PER_PIXEL|LV_COLOR_DEPTH|ZMK_DISPLAY_STATUS_SCREEN_CUSTOM|MAIN_STACK_SIZE|ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE|ZMK_STUDIO_RPC_(RX_BUF_SIZE|TX_BUF_SIZE|THREAD_STACK_SIZE))=' "$cfg" || true
          done
          python3 - <<'PY'
          import glob, re
          for path in glob.glob("build/*/zephyr/zephyr_pre0.map"):
              print(f"=== {path} ===")
              lines = open(path, errors="replace").read().splitlines()
              for line in lines:
                  if "Memory Configuration" in line or re.search(r"\bRAM\b", line):
                      print(line)
              entries = []
              for line in lines:
                  match = re.search(r"(0x[0-9a-fA-F]+)\s+(0x[0-9a-fA-F]+)\s+(.+)", line)
                  if match:
                      size = int(match.group(2), 16)
                      if int(match.group(1), 16) >= 0x20000000 and size >= 256:
                          entries.append((size, line.strip()))
              for _, line in sorted(entries, reverse=True)[:40]:
                  print(line)
          PY
      - name: Collect flat firmware files
        shell: bash
        run: |
          mkdir -p firmware
          while IFS= read -r -d '' image; do
            name=$(basename "$(dirname "$(dirname "$image")")")
            cp "$image" "firmware/${name}.uf2"
          done < <(find build -type f -path '*/zephyr/zmk.uf2' -print0)

          expected=(
            velvet_left_cube.uf2
            velvet_right_cube.uf2
            settings_reset.uf2
          )
          for name in "${expected[@]}"; do
            test -s "firmware/$name" || { echo "Missing firmware: $name" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cube-peripherals-experimental
          path: firmware/*.uf2
