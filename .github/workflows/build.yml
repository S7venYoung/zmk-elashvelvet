name: Build standalone Pad16 nRF52840
on:
  workflow_dispatch:
    inputs:
      bootloader:
        description: Build Pad Rasi bootloader instead of application
        type: boolean
        default: false
      reverse_matrix:
        description: Diagnostic only - test row2col with the same GPIOs
        type: boolean
        default: false
jobs:
  pad:
    if: ${{ !inputs.bootloader }}
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
      - run: west init -l pad/config && cd pad && west update --narrow && west zephyr-export
      - name: Build Pad16
        shell: bash
        run: |
          extra=()
          if [ "${{ inputs.reverse_matrix }}" = "true" ]; then
            extra+=("-DEXTRA_DTC_OVERLAY_FILE=$GITHUB_WORKSPACE/pad/row2col-test.overlay")
          fi
          cd pad
          west build -s zmk/app -d build/pad52840 -b nice_nano//zmk -S studio-rpc-usb-uart -- -DZMK_CONFIG="$GITHUB_WORKSPACE/pad/config" -DSHIELD=pad52840 -DZMK_EXTRA_MODULES="$GITHUB_WORKSPACE/pad/diagnostics" "${extra[@]}"
      - name: Collect Pad16 UF2
        run: |
          mkdir -p firmware
          cp pad/build/pad52840/zephyr/zmk.uf2 firmware/pad52840_standalone.uf2
          cp pad/build/pad52840/zephyr/.config firmware/pad52840_app_config.txt
          cp pad/build/pad52840/zephyr/zephyr.dts firmware/pad52840_app.dts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.reverse_matrix && 'pad52840-matrix-row2col-test' || 'pad52840-standalone' }}
          path: firmware/
  pad-bootloader:
    if: ${{ inputs.bootloader }}
    uses: ./.github/workflows/build-pad-bootloader.yml
