name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths-ignore: ["keymap-drawer/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
      - run: west init -l config && west update --narrow && west zephyr-export
      - run: west zmk-build -d ./build -q
      - name: Collect flat firmware files
        shell: bash
        run: |
          mkdir -p firmware
          while IFS= read -r -d '' image; do
            name=$(basename "$(dirname "$(dirname "$image")")")
            cp "$image" "firmware/${name}.uf2"
          done < <(find build -type f -path '*/zephyr/zmk.uf2' -print0)
          test -n "$(find firmware -maxdepth 1 -type f -name '*.uf2' -print -quit)" || {
            echo "No UF2 firmware files were collected" >&2
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/*.uf2
