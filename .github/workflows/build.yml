name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths-ignore: ["keymap-drawer/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
      - run: west init -l config && west update --narrow && west zephyr-export
      - run: west zmk-build -d ./build -q
      - name: Report effective configuration and RAM allocations
        if: always()
        shell: bash
        run: |
          for cfg in build/*/zephyr/.config; do
            echo "=== $cfg ==="
            grep -E '^CONFIG_(BT_BUF_(ACL_TX_COUNT|EVT_RX_COUNT)|BT_L2CAP_TX_BUF_COUNT|BT_MAX_CONN|ZMK_BEHAVIORS_QUEUE_SIZE|LV_Z_MEM_POOL_SIZE|LV_Z_VDB_SIZE|LV_Z_BITS_PER_PIXEL|LV_COLOR_DEPTH|ZMK_DISPLAY_STATUS_SCREEN_CUSTOM|MAIN_STACK_SIZE|ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE|ZMK_STUDIO_RPC_(RX_BUF_SIZE|TX_BUF_SIZE|THREAD_STACK_SIZE))=' "$cfg" || true
          done
          python3 - <<'PY'
          import glob, re
          for path in glob.glob("build/*/zephyr/zephyr_pre0.map"):
              print(f"=== {path} ===")
              lines = open(path, errors="replace").read().splitlines()
              for line in lines:
                  if "Memory Configuration" in line or re.search(r"\bRAM\b", line):
                      print(line)
              entries = []
              for line in lines:
                  match = re.search(r"(0x[0-9a-fA-F]+)\s+(0x[0-9a-fA-F]+)\s+(.+)", line)
                  if match:
                      size = int(match.group(2), 16)
                      if int(match.group(1), 16) >= 0x20000000 and size >= 256:
                          entries.append((size, line.strip()))
              for _, line in sorted(entries, reverse=True)[:40]:
                  print(line)
          PY
      - name: Collect flat firmware files
        shell: bash
        run: |
          mkdir -p firmware
          while IFS= read -r -d '' image; do
            name=$(basename "$(dirname "$(dirname "$image")")")
            cp "$image" "firmware/${name}.uf2"
          done < <(find build -type f -path '*/zephyr/zmk.uf2' -print0)

          expected=(
            velvet_prospector_dongle_walle.uf2
            velvet_left_dongle.uf2
            velvet_right_dongle.uf2
            settings_reset_xiao.uf2
            velvet_left.uf2
            velvet_right.uf2
            settings_reset.uf2
          )
          for name in "${expected[@]}"; do
            test -s "firmware/$name" || { echo "Missing firmware: $name" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/*.uf2
