name: Build ZMK firmware
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Build normal firmware or a single Pad receiver diagnostic image
        type: choice
        default: normal
        options:
          - normal
          - nano-stable
          - pad-diagnostic
          - pad-clear-bonds
          - pad-local-dfu
          - pad-rtt-diagnostic
jobs:
  build:
    if: ${{ inputs.variant == 'normal' }}
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
      - name: Test three-peripheral layout and layer isolation
        run: python3 scripts/test_numpad_dongle.py

      - run: west init -l config && west update --narrow && west zephyr-export
      - name: Set low duty Pad reconnect advertising
        run: python3 scripts/patch_pad_advertising_interval.py dependencies/zmk/app/src/split/bluetooth/peripheral.c
      - name: Test and install Nano split scan failure recovery
        run: |
          python3 scripts/test_nano_split_scan_retry.py dependencies/zmk/app/src/split/bluetooth/central.c
          python3 scripts/patch_nano_split_scan_retry.py dependencies/zmk/app/src/split/bluetooth/central.c
      - name: Test and install real DYA split connection state
        run: |
          python3 scripts/test_ble_management_split_info.py dependencies/zmk-module-ble-management/src/studio/ble_management_handler.c
          python3 scripts/patch_ble_management_split_info.py dependencies/zmk-module-ble-management/src/studio/ble_management_handler.c
      - name: Normalize public behavior names
        run: python3 scripts/patch_behavior_names.py dependencies
      - name: Bound Nano custom settings metadata RAM
        run: python3 scripts/patch_nano_settings_ram.py dependencies/zmk-feature-custom-settings
      - name: Order Nano split initialization after Bluetooth
        run: python3 scripts/patch_nano_split_init.py dependencies/zmk/app/src/split/bluetooth/central.c
      - name: Install Nano Studio action hook
        run: python3 scripts/patch_studio_binding_actions.py dependencies/zmk/app/src/keymap.c
      - name: Install single-advertiser Nano scanner patch
        run: python3 scripts/patch_nano_scanner_advertising.py dependencies/prospector-zmk-module/src/status_advertisement.c
      - name: Test reset bootloader transition
        run: python3 scripts/test_settings_reset_bootloader.py
      - name: Make settings reset return to bootloader
        run: python3 scripts/patch_settings_reset_bootloader.py dependencies/zmk/app/src/settings/reset_settings_on_start.c
      - name: Test physical-half telemetry
        run: |
          cc -Wall -Wextra -Werror -Isrc scripts/test_half_telemetry.c -o /tmp/test-half
          /tmp/test-half
          cc -Wall -Wextra -Werror scripts/test_adv_layout.c -o /tmp/test-layout
          /tmp/test-layout
      - name: Test right display overlay loading order
        run: python3 scripts/test_right_display_overlay.py dependencies/zephyr dependencies/mario-peripheral-animation
      - name: Test memory LCD VCOM command encoding
        run: python3 scripts/test_nice_view_vcom.py dependencies/zephyr/drivers/display/ls0xx.c
      - name: Test cat renderer and layer relay state
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc/display/themes/cat src/display/themes/cat/tests/test_cat_display.c -o /tmp/test-cat
          /tmp/test-cat
      - name: Test Cube packet cadence
        run: python3 scripts/test_scanner_payload.py
      - name: Test display runtime diagnostic packets
        run: |
          cc -std=c11 -Wall -Wextra -Werror src/display/tests/test_dashboard_debug.c -o /tmp/test-dashboard-debug
          /tmp/test-dashboard-debug
      - name: Test display relay BLE framing
        run: |
          python3 scripts/test_dashboard_relay.py dependencies/zmk
          python3 scripts/test_dashboard_theme_cache.py
      - name: Install physical-half scanner status fields
        run: python3 scripts/patch_dongle_status_fields.py dependencies/prospector-zmk-module/src/status_advertisement.c
      - run: west zmk-build -d ./build -q
      - name: Verify actual Nano split initialization order
        run: python3 scripts/verify_nano_split_init.py build/velvet_nano_dongle/zephyr/zmk.elf
      - name: Verify actual Nano split scan failure recovery
        run: python3 scripts/verify_nano_split_scan_retry.py build/velvet_nano_dongle/zephyr/zmk.elf
      - name: Verify DYA central capabilities
        run: python3 scripts/verify_dya_features.py build
      - name: Test Codex and system dashboard renderers
        shell: bash
        run: |
          cc -std=c11 -Wall -Wextra -Werror src/display/tests/test_dashboard.c -o /tmp/test-dashboard
          /tmp/test-dashboard
      - name: Verify actual display relay-name capacity
        shell: bash
        run: |
          for target in velvet_nano_dongle velvet_left_dongle velvet_right_dongle; do
            cfg="build/$target/zephyr/.config"
            grep -qx 'CONFIG_ZMK_SPLIT_RELAY_EVENT_TYPE_NAME_LEN=32' "$cfg"
            grep '^CONFIG_ZMK_SPLIT_RELAY_EVENT_TYPE_NAME_LEN=' "$cfg"
          done
      - name: Verify physical-half telemetry relay
        shell: bash
        run: |
          for name in velvet_left_dongle velvet_right_dongle; do
            cfg="build/$name/zephyr/.config"
            for option in ZMK_SPLIT_RELAY_EVENT ZMK_BATTERY_REPORTING BT_BAS; do
              grep -qx "CONFIG_${option}=y" "$cfg"
            done
            find "build/$name" -name half_telemetry.c.obj -print -quit | grep -q .
          done
          find build -path '*velvet_nano_dongle*' -name half_telemetry.c.obj -print -quit | grep -q .
          grep -q VELVET_DONGLE_STATUS_FIELDS dependencies/prospector-zmk-module/src/status_advertisement.c
          grep -q VELVET_ZEPHYR41_ENUM_OPTION dependencies/prospector-zmk-module/src/status_advertisement.c
          ! grep -Eq '^#if defined\\(BT_LE_ADV_OPT_(FORCE_NAME_IN_AD|SCANNABLE)\\)' dependencies/prospector-zmk-module/src/status_advertisement.c
      - name: Verify selectable keyboard dashboards
        shell: bash
        run: |
          left=build/velvet_left_dongle/zephyr/.config
          right=build/velvet_right_dongle/zephyr/.config
          grep -qx 'CONFIG_VELVET_DASHBOARD_DISPLAY=y' "$left"
          grep -qx '# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN is not set' "$left"
          ! grep -qx 'CONFIG_VELVET_CAT_DISPLAY=y' "$left"
          for option in ZMK_DISPLAY ZMK_DISPLAY_STATUS_SCREEN_CUSTOM VELVET_DASHBOARD_DISPLAY LV_USE_IMAGE LS0XX LV_COLOR_DEPTH_1; do
            grep -qx "CONFIG_${option}=y" "$right"
          done
          grep -qx '# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN is not set' "$right"
          grep -qx '# CONFIG_NICE_VIEW_WIDGET_STATUS is not set' "$right"
          # Retain Velvet's board-specific peripheral control on both keyboards.
          for cfg in "$left" "$right"; do
            for option in ZMK_BACKLIGHT PWM LED_PWM ZMK_BACKLIGHT_ON_START; do
              grep -qx "CONFIG_${option}=y" "$cfg"
            done
            grep -qx 'CONFIG_ZMK_BACKLIGHT_BRT_START=100' "$cfg"
            grep -qx '# CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE is not set' "$cfg"
          done
          grep -qx 'CONFIG_LV_CACHE_DEF_SIZE=0' "$right"
          grep -qx 'CONFIG_LV_DRAW_SW_SUPPORT_L8=y' "$right"
          grep -qx '# CONFIG_ZMK_SPLIT_ROLE_CENTRAL is not set' "$right"
          for side in left right; do
            cfg="build/velvet_${side}_dongle/zephyr/.config"
            grep -qx 'CONFIG_VELVET_DASHBOARD_DISPLAY=y' "$cfg"
            grep -qx 'CONFIG_LV_DRAW_SW_SUPPORT_L8=y' "$cfg"
            grep -qx 'CONFIG_LV_CACHE_DEF_SIZE=0' "$cfg"
            grep -qx '# CONFIG_NICE_VIEW_WIDGET_STATUS is not set' "$cfg"
            find "build/velvet_${side}_dongle" -name dashboard_screen.c.obj -print -quit | grep -q .
          done
          find build/velvet_nano_dongle -name dashboard_bridge.c.obj -print -quit | grep -q .
          find build/velvet_nano_dongle -name cat_layer_relay.c.obj -print -quit | grep -q .
          grep -q vcom_toggle_thread build/velvet_right_dongle/zephyr/zmk.map
          python3 - <<'PY'
          from pathlib import Path
          import re
          dts=Path("build/velvet_right_dongle/zephyr/zephyr.dts").read_text()
          assert "serial-vcom-inversion;" in dts
          value=re.search(r"serial-vcom-interval\s*=\s*<\s*(0x[0-9a-f]+|[0-9]+)\s*>",dts)
          assert value and int(value[1],0)==33
          PY
      - name: Verify settings reset returns to bootloader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          count = 0
          for cfg in Path("build").glob("*/zephyr/.config"):
              text = cfg.read_text()
              if "CONFIG_SHIELD_SETTINGS_RESET=y\n" not in text:
                  continue
              count += 1
              assert "CONFIG_ZMK_SETTINGS_RESET_ON_START=y\n" in text, cfg
              assert "CONFIG_RETENTION_BOOT_MODE=y\n" in text, cfg
              symbols = (cfg.parent / "zmk.map").read_text()
              for name in ("velvet_reset_settings", "velvet_reset_finish", "velvet_reset_enter_bootloader"):
                  assert name in symbols, (cfg, name)
          assert count, "No settings reset builds found"
          PY
      - name: Verify scanner and recovery configuration
        shell: bash
        run: |
          config=build/velvet_nano_dongle/zephyr/.config
          grep -qx 'CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=64' "$config"
          grep -qx 'CONFIG_BT_MAX_PAIRED=8' "$config"
          grep -qx 'CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=3' "$config"
          grep -qx '# CONFIG_BT_EXT_ADV is not set' "$config"
          grep -qx 'CONFIG_ZMK_STATUS_ADVERTISEMENT=y' "$config"
          grep -qx 'CONFIG_PROSPECTOR_EXPECTED_PERIPHERAL_COUNT=3' "$config"
          grep -qx 'CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096' "$config"
          grep -qx 'CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=512' "$config"
          grep -qx 'CONFIG_ZMK_CUSTOM_SETTINGS_LIST_NOTIFICATION_BATCH_SIZE=1' "$config"
          grep -qx 'CONFIG_ZMK_CUSTOM_SETTINGS_LIST_NOTIFICATION_DELAY_MS=50' "$config"
          for source in status_advertisement.c velvet_stats.c scanner_payload.c; do
            find build/velvet_nano_dongle -name "$source.obj" -print -quit | grep -q .
          done
          test -z "$(find build/velvet_nano_dongle -name fight_telemetry.c.obj -print -quit)"
      - name: Verify lightweight numpad peripheral
        run: python3 scripts/verify_numpad_build.py build
      - name: Verify compiled idle and deep-sleep policy
        shell: bash
        run: |
          python3 scripts/verify_power_policy.py build
      - name: Report Nano memory
        run: west build -d build/velvet_nano_dongle -t ram_report
      - name: Verify Nano replug bootloader is linked
        shell: bash
        run: |
          grep -qx 'CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y' build/velvet_nano_dongle/zephyr/.config
          grep -qx '# CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL is not set' build/velvet_nano_dongle/zephyr/.config
          grep -qx 'CONFIG_VELVET_STUDIO_BINDING_ACTIONS=y' build/velvet_nano_dongle/zephyr/.config
          find build/velvet_nano_dongle -type f -name 'studio_binding_actions.c.obj' -print -quit | grep -q .
          grep -qx 'CONFIG_VELVET_NANO_REPLUG_BOOTLOADER=y' build/velvet_nano_dongle/zephyr/.config
          find build/velvet_nano_dongle -type f -name 'nano_replug_bootloader.c.obj' -print -quit | grep -q .
      - name: Report RAM map for failed link
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, re
          for path in glob.glob("build/*/zephyr/zephyr_pre0.map"):
              print(f"=== {path} ===")
              lines = open(path, errors="replace").read().splitlines()
              for line in lines:
                  if "Memory Configuration" in line or re.search(r"\bRAM\b", line):
                      print(line)
              entries = []
              for line in lines:
                  match = re.match(r"\s*(0x[0-9a-fA-F]+)\s+(0x[0-9a-fA-F]+)\s+(.+)", line)
                  if match:
                      size = int(match.group(2), 16)
                      if size >= 256:
                          entries.append((size, line.strip()))
              for _, line in sorted(entries, reverse=True)[:40]:
                  print(line)
          PY
      - name: Collect flat firmware files
        shell: bash
        run: |
          mkdir -p firmware
          while IFS= read -r -d '' image; do
            name=$(basename "$(dirname "$(dirname "$image")")")
            cp "$image" "firmware/${name}.uf2"
          done < <(find build -type f -path '*/zephyr/zmk.uf2' -print0)

          cp build/eyelash_numpad_peripheral/zephyr/zmk.hex firmware/eyelash_numpad_peripheral.hex
          expected=(
            velvet_nano_dongle.uf2
            velvet_left_dongle.uf2
            velvet_right_dongle.uf2
            eyelash_numpad_peripheral.hex
            settings_reset_nano.uf2
            settings_reset.uf2
          )
          for name in "${expected[@]}"; do
            test -s "firmware/$name" || { echo "Missing firmware: $name" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/
      - name: Preserve numpad and dongle memory evidence
        uses: actions/upload-artifact@v4
        with:
          name: numpad-build-evidence
          path: |
            build/velvet_nano_dongle/zephyr/.config
            build/velvet_nano_dongle/zephyr/zmk.elf
            build/velvet_nano_dongle/zephyr/zmk.map
            build/velvet_nano_dongle/stdout_and_stderr.log
            build/eyelash_numpad_peripheral/zephyr/.config
            build/eyelash_numpad_peripheral/zephyr/zmk.elf
            build/eyelash_numpad_peripheral/zephyr/zmk.map
            build/eyelash_numpad_peripheral/stdout_and_stderr.log
          include-hidden-files: true
          if-no-files-found: error

  numpad-bootloader:
    if: ${{ inputs.variant == 'normal' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r numpad/requirements-dfu.txt
      - name: Host tests for peripheral bootloader and DFU packaging
        run: python -m unittest discover -s numpad/tests -v
      - name: Test browser DFU package and ACK protocol
        run: |
          node numpad/tests_web/test_web_dfu.mjs
          node numpad/tests_web/test_hex_dfu.mjs
      - name: Install ARM compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - run: bash numpad/scripts/build_bootloader.sh
      - uses: actions/upload-artifact@v4
        with:
          name: eyelash-numpad-peripheral-bootloader
          path: numpad/dist/bootloader/*.hex
          if-no-files-found: error

  package-numpad:
    needs: [build, numpad-bootloader]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r numpad/requirements-dfu.txt
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: incoming/firmware
      - uses: actions/download-artifact@v4
        with:
          name: eyelash-numpad-peripheral-bootloader
          path: incoming/bootloader
      - name: Validate and package peripheral-only OTA and initial SWD image
        run: >-
          python numpad/scripts/firmware_artifacts.py
          --application incoming/firmware/eyelash_numpad_peripheral.hex
          --bootloader incoming/bootloader/eyelash-numpad-peripheral-bootloader-s132.hex
          --output numpad/dist/release
      - run: cp docs/nano-dongle-numpad.md numpad/dist/release/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: eyelash-numpad-peripheral-swd-and-ble-dfu
          path: numpad/dist/release/
          if-no-files-found: error

  nano-stable:
    if: ${{ inputs.variant == 'nano-stable' }}
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
      - run: west init -l config && west update --narrow && west zephyr-export
      - name: Apply normal Nano source preparation
        run: |
          python3 scripts/test_nano_split_scan_retry.py dependencies/zmk/app/src/split/bluetooth/central.c
          python3 scripts/patch_nano_split_scan_retry.py dependencies/zmk/app/src/split/bluetooth/central.c
          python3 scripts/test_ble_management_split_info.py dependencies/zmk-module-ble-management/src/studio/ble_management_handler.c
          python3 scripts/patch_ble_management_split_info.py dependencies/zmk-module-ble-management/src/studio/ble_management_handler.c
          python3 scripts/patch_behavior_names.py dependencies
          python3 scripts/patch_nano_settings_ram.py dependencies/zmk-feature-custom-settings
          python3 scripts/patch_nano_split_init.py dependencies/zmk/app/src/split/bluetooth/central.c
          python3 scripts/patch_studio_binding_actions.py dependencies/zmk/app/src/keymap.c
          python3 scripts/patch_nano_scanner_advertising.py dependencies/prospector-zmk-module/src/status_advertisement.c
          python3 scripts/patch_settings_reset_bootloader.py dependencies/zmk/app/src/settings/reset_settings_on_start.c
          python3 scripts/patch_dongle_status_fields.py dependencies/prospector-zmk-module/src/status_advertisement.c
      - name: Build only the normal Nano receiver without temporary diagnostics
        run: python3 scripts/build_nano_stable.py
      - name: Verify initialization, DYA features, stack and preserved bonds
        run: |
          python3 scripts/verify_nano_split_init.py build/nano_stable/zephyr/zmk.elf
          python3 scripts/verify_nano_split_scan_retry.py build/nano_stable/zephyr/zmk.elf
          python3 scripts/verify_dya_features.py build
          cfg=build/nano_stable/zephyr/.config
          grep -qx 'CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096' "$cfg"
          grep -qx 'CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=3' "$cfg"
          ! grep -qx 'CONFIG_VELVET_PAD_LINK_DIAGNOSTICS=y' "$cfg"
          ! grep -qx 'CONFIG_ZMK_USB_LOGGING=y' "$cfg"
          ! grep -qx 'CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y' "$cfg"
          ! grep -qx 'CONFIG_ZMK_SETTINGS_RESET_ON_START=y' "$cfg"
      - name: Collect normal receiver image
        run: |
          mkdir -p firmware
          cp build/nano_stable/zephyr/zmk.uf2 firmware/velvet_nano_dongle.uf2
          cp docs/nano-settings-ram.md firmware/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: nano-stable
          path: firmware/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nano-stable-evidence
          path: |
            build/nano_stable/zephyr/.config
            build/nano_stable/zephyr/zephyr.dts
            build/nano_stable/zephyr/zmk.elf
            build/nano_stable/zephyr/zmk.map
            build/nano_stable/zephyr/zephyr_pre0.map
          include-hidden-files: true

  pad-dongle-diagnostic:
    if: ${{ inputs.variant == 'pad-diagnostic' }}
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
      - run: west init -l config && west update --narrow && west zephyr-export
      - name: Apply normal Nano source preparation
        run: |
          python3 scripts/test_nano_split_scan_retry.py dependencies/zmk/app/src/split/bluetooth/central.c
          python3 scripts/patch_nano_split_scan_retry.py dependencies/zmk/app/src/split/bluetooth/central.c
          python3 scripts/test_ble_management_split_info.py dependencies/zmk-module-ble-management/src/studio/ble_management_handler.c
          python3 scripts/patch_ble_management_split_info.py dependencies/zmk-module-ble-management/src/studio/ble_management_handler.c
          python3 scripts/patch_behavior_names.py dependencies
          python3 scripts/patch_nano_settings_ram.py dependencies/zmk-feature-custom-settings
          python3 scripts/patch_nano_split_init.py dependencies/zmk/app/src/split/bluetooth/central.c
          python3 scripts/patch_studio_binding_actions.py dependencies/zmk/app/src/keymap.c
          python3 scripts/patch_nano_scanner_advertising.py dependencies/prospector-zmk-module/src/status_advertisement.c
          python3 scripts/patch_settings_reset_bootloader.py dependencies/zmk/app/src/settings/reset_settings_on_start.c
          python3 scripts/patch_dongle_status_fields.py dependencies/prospector-zmk-module/src/status_advertisement.c
      - name: Build only the three-peer receiver diagnostic variant
        run: python3 scripts/build_pad_diagnostic.py --build
      - name: Verify compiled diagnostics and preserved bonds policy
        run: |
          python3 scripts/verify_nano_split_init.py build/pad_dongle_diagnostic/zephyr/zmk.elf
          python3 scripts/verify_nano_split_scan_retry.py build/pad_dongle_diagnostic/zephyr/zmk.elf
          python3 scripts/verify_dya_features.py build
          cfg=build/pad_dongle_diagnostic/zephyr/.config
          grep -qx 'CONFIG_VELVET_PAD_LINK_DIAGNOSTICS=y' "$cfg"
          grep -qx 'CONFIG_ZMK_USB_LOGGING=y' "$cfg"
          grep -qx 'CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=3' "$cfg"
          ! grep -qx 'CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y' "$cfg"
          ! grep -qx 'CONFIG_ZMK_SETTINGS_RESET_ON_START=y' "$cfg"
          find build/pad_dongle_diagnostic -name pad_link_diagnostics.c.obj | grep -q .
      - name: Collect clearly named diagnostic image
        run: |
          mkdir -p firmware
          cp build/pad_dongle_diagnostic/zephyr/zmk.uf2 firmware/velvet_nano_dongle_pad_diagnostic.uf2
          cp docs/pad-link-diagnostic.md firmware/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: pad-dongle-diagnostic
          path: firmware/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pad-dongle-diagnostic-evidence
          path: |
            build/pad_dongle_diagnostic/zephyr/.config
            build/pad_dongle_diagnostic/zephyr/zephyr.dts
            build/pad_dongle_diagnostic/zephyr/zmk.elf
            build/pad_dongle_diagnostic/zephyr/zmk.map
            build/pad_dongle_diagnostic/zephyr/zephyr_pre0.map
          include-hidden-files: true

  pad-clear-bonds:
    if: ${{ inputs.variant == 'pad-clear-bonds' }}
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
      - run: west init -l config && west update --narrow && west zephyr-export
      - run: python3 scripts/patch_behavior_names.py dependencies
      - name: Build Pad only with Bluetooth bond clearing enabled
        run: >-
          west build -s dependencies/zmk/app -d build/pad_clear_bonds
          -b eyelash_numpad/nrf52832 --
          -DZMK_CONFIG=$PWD/config
          -DZMK_EXTRA_MODULES=$PWD
          -DSHIELD=eyelash_numpad
          -DCONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y
      - name: Verify target and restricted reset policy
        run: |
          cfg=build/pad_clear_bonds/zephyr/.config
          grep -qx 'CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y' "$cfg"
          grep -qx 'CONFIG_SOC_NRF52832=y' "$cfg"
          ! grep -qx 'CONFIG_ZMK_SETTINGS_RESET_ON_START=y' "$cfg"
          ! grep -qx 'CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y' "$cfg"
          mkdir -p firmware
          cp build/pad_clear_bonds/zephyr/zmk.hex firmware/eyelash_numpad_clear_bonds.hex
          cp docs/pad-clear-bonds.md firmware/README.md
          sha256sum firmware/*.hex > firmware/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: eyelash-pad-clear-bonds
          path: firmware/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eyelash-pad-clear-bonds-evidence
          include-hidden-files: true
          path: |
            build/pad_clear_bonds/zephyr/.config
            build/pad_clear_bonds/zephyr/zephyr.dts
            build/pad_clear_bonds/zephyr/zmk.map

  pad-local-dfu:
    if: ${{ inputs.variant == 'pad-local-dfu' || inputs.variant == 'pad-rtt-diagnostic' }}
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
      - run: west init -l config && west update --narrow && west zephyr-export
      - run: python3 scripts/patch_behavior_names.py dependencies
      - name: Set low duty Pad reconnect advertising
        run: python3 scripts/patch_pad_advertising_interval.py dependencies/zmk/app/src/split/bluetooth/peripheral.c
      - name: Build Pad with local DFU shortcut
        env:
          PAD_VARIANT: ${{ inputs.variant }}
        run: |
          set --
          if [ "$PAD_VARIANT" = pad-rtt-diagnostic ]; then
            python3 scripts/patch_pad_rtt_trace.py dependencies/zmk/app/src/split/bluetooth/peripheral.c
            set -- "-DEXTRA_CONF_FILE=$PWD/config/pad_rtt_diagnostic.conf"
          fi
          west build -s dependencies/zmk/app -d build/pad_local_dfu \
            -b eyelash_numpad/nrf52832 -- \
            -DZMK_CONFIG="$PWD/config" -DZMK_EXTRA_MODULES="$PWD" \
            -DSHIELD=eyelash_numpad -DCONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n "$@"
      - name: Verify target and restricted reset policy
        env:
          PAD_VARIANT: ${{ inputs.variant }}
        run: |
          cfg=build/pad_local_dfu/zephyr/.config
          python3 scripts/verify_power_policy.py build pad_local_dfu
          grep -qx '# CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START is not set' "$cfg"
          grep -qx 'CONFIG_SOC_NRF52832=y' "$cfg"
          ! grep -qx 'CONFIG_ZMK_SETTINGS_RESET_ON_START=y' "$cfg"
          ! grep -qx 'CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y' "$cfg"
          find build/pad_local_dfu -name eyelash_local_dfu.c.obj | grep -q .
          cc -std=c11 -Wall -Wextra -Werror -Isrc scripts/test_eyelash_local_dfu.c -o /tmp/test-local-dfu
          /tmp/test-local-dfu
          if [ "$PAD_VARIANT" = pad-rtt-diagnostic ]; then
            grep -qx 'CONFIG_LOG_BACKEND_RTT=y' "$cfg"
            grep -qx 'CONFIG_LOG_BACKEND_RTT_MODE_DROP=y' "$cfg"
            grep -q 'pad_rtt_heartbeat' build/pad_local_dfu/zephyr/zmk.map
          fi
          mkdir -p firmware
          cp build/pad_local_dfu/zephyr/zmk.hex firmware/eyelash_numpad_peripheral_local_dfu.hex
          cp docs/nano-dongle-numpad.md firmware/README.md
      - name: Package application-only Pad OTA
        env:
          PAD_VARIANT: ${{ inputs.variant }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-venv
          python3 -m venv /tmp/pad-dfu-venv
          /tmp/pad-dfu-venv/bin/pip install -r numpad/requirements-dfu.txt
          python3 numpad/scripts/firmware_artifacts.py \
            --application firmware/eyelash_numpad_peripheral_local_dfu.hex \
            --output firmware --nrfutil /tmp/pad-dfu-venv/bin/adafruit-nrfutil
          if [ "$PAD_VARIANT" = pad-rtt-diagnostic ]; then
            mv firmware/eyelash-numpad-peripheral-ota.zip firmware/eyelash-pad-rtt-diagnostic-ota.zip
            cp docs/pad-rtt-diagnostic.md firmware/README.md
          fi
          sha256sum firmware/*.hex firmware/*.zip > firmware/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: eyelash-${{ inputs.variant }}
          path: firmware/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eyelash-${{ inputs.variant }}-evidence
          include-hidden-files: true
          path: |
            build/pad_local_dfu/zephyr/.config
            build/pad_local_dfu/zephyr/zephyr.dts
            build/pad_local_dfu/zephyr/zmk.map
            build/pad_local_dfu/zephyr/zmk.elf
