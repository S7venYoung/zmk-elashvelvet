name: Dispatch Nano stable

on:
  push:
    branches:
      - codex/nano-dongle-numpad
    paths:
      - .github/workflows/dispatch-nano-stable.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch requested Nano stable build
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run build.yml
          --ref codex/nano-dongle-numpad
          -f variant=nano-stable
