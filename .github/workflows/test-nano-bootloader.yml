name: Build nRF52833 Bootloader
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, replug]
    steps:
      - uses: actions/checkout@v4
        with:
          path: config
      - uses: actions/checkout@v4
        with:
          repository: kbladewht/Adafruit_nRF52_Bootloader
          ref: d7c55d99c97633a770c5536dc113e3849f3bc91e
          fetch-depth: 0
          submodules: true
          path: bootloader
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '12.3.Rel1'
      - name: Install HEX tools
        run: pip install intelhex
      - name: Test reset policy
        run: |
          cc -Wall -Wextra -Werror config/bootloader-test/test_policy.c -o /tmp/test-policy
          /tmp/test-policy
          cc -Wall -Wextra -Werror config/bootloader-test/test_journal.c -o /tmp/test-journal
          /tmp/test-journal
      - name: Prepare pinned source
        run: python3 config/bootloader-test/prepare.py bootloader ${{ matrix.mode }}
      - name: Test actual USB timeout callback
        if: matrix.mode == 'replug'
        run: python3 config/bootloader-test/test_usb_timeout.py bootloader/lib/sdk11/components/libraries/bootloader_dfu/bootloader.c
      - name: Build bootloader only
        working-directory: bootloader
        shell: bash
        run: |
          version="0.9.2-10-gd7c55d9-nano-dongle-${{ matrix.mode }}"
          make -j2 BOARD=feather_nrf52833_express GIT_VERSION="$version" "_build/build-feather_nrf52833_express/feather_nrf52833_express_bootloader-${version}.hex"
      - name: Check address layout and export bootloader
        shell: bash
        run: |
          python3 config/bootloader-test/verify.py bootloader ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        with:
          name: nano-dongle-bootloader-${{ matrix.mode }}-BL-ONLY
          path: artifacts/
          if-no-files-found: error

      - name: Verify field-tested full recovery HEX
        if: matrix.mode == 'replug'
        run: python3 config/bootloader-test/verify_full_recovery.py
      - uses: actions/upload-artifact@v4
        if: matrix.mode == 'replug'
        with:
          name: nano33-full-recovery-verified
          path: config/bootloader/firmware/
          if-no-files-found: error
