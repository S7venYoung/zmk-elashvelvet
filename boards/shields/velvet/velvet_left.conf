CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_26=y
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
CONFIG_SETTINGS=y
CONFIG_ZMK_BATTERY_HISTORY=n

# Velvet hardware control: main uses PWM P1.13 for peripheral power/control.
# This is separate from EXT_POWER P0.13 and must not be removed as RGB support.
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_BACKLIGHT_ON_START=y
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n

CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_VIEW_WIDGET_STATUS=n
CONFIG_LV_DRAW_SW_SUPPORT_L8=y
CONFIG_LV_CACHE_DEF_SIZE=0

CONFIG_VELVET_CUBE_CAT_DISPLAY=y

CONFIG_LS0XX_VCOM_THREAD_PRIO=11
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=y
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_SPLIT_RELAY=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
CONFIG_ZMK_SPLIT_RELAY_EVENT_TYPE_NAME_LEN=32
