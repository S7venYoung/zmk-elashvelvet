# nice!nano nRF52840 is the USB-facing split central.
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768

CONFIG_ZMK_USB=y
CONFIG_BT_BAS=n

CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=6
CONFIG_BT_BUF_ACL_TX_COUNT=3
CONFIG_BT_BUF_EVT_RX_COUNT=6
CONFIG_BT_L2CAP_TX_BUF_COUNT=4
# ATT transmit queue: receiver only (Zephyr 4.1).
CONFIG_BT_ATT_TX_COUNT=15
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_DEVTOOL=y
CONFIG_ZMK_DEVTOOL_STUDIO_RPC=y
CONFIG_ZMK_DEVTOOL_LAYER_STATE=n

# DYA Studio central features.
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y
CONFIG_ZMK_BATTERY_HISTORY=n
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=n
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS_IN_BINDINGS=y
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER=y
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y

CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
CONFIG_SETTINGS=y
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=128
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=128
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=128
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=16
CONFIG_ZMK_CUSTOM_SETTINGS_RECORD=n
CONFIG_ZMK_CUSTOM_SETTINGS_RPC_CONVERTERS=n
CONFIG_ZMK_CUSTOM_SETTINGS_ARRAY_VIEW_POOL_SIZE=8
CONFIG_ZMK_CUSTOM_SETTINGS_NOTIFICATION_QUEUE_SIZE=4
CONFIG_ZMK_CUSTOM_SETTINGS_RELAY_REQUEST_QUEUE_SIZE=2
CONFIG_ZMK_CUSTOM_SETTINGS_RELAY_NOTIFICATION_QUEUE_SIZE=2
CONFIG_ZMK_FAST_KEYMAP_FP_CACHE=n
CONFIG_ZMK_RUNTIME_MACRO_COUNT=4
CONFIG_ZMK_RUNTIME_MACRO_POOL_BYTES=512
CONFIG_ZMK_RUNTIME_MACRO_MAX_BYTES=128
CONFIG_ZMK_RUNTIME_COMBO_MAX_COMBOS=4
CONFIG_ZMK_RUNTIME_COMBO_MAX_POSITIONS_PER_COMBO=8

# nice!nano nRF52840 has an external 32 kHz crystal.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=n
CONFIG_VELVET_NANO_REPLUG_BOOTLOADER=y
CONFIG_VELVET_STUDIO_BINDING_ACTIONS=y
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_BACKLIGHT=n
CONFIG_LVGL=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_26=n
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26=n
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_LV_Z_MEM_POOL_SIZE=9216
CONFIG_LV_Z_VDB_SIZE=25
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256

# Discoverable by standalone Prospector scanners, without pairing.
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="AUX"
CONFIG_ZMK_STATUS_ADV_LEFT_PERIPHERAL=0
CONFIG_ZMK_STATUS_ADV_RIGHT_PERIPHERAL=1
CONFIG_ZMK_STATUS_ADV_AUX2_PERIPHERAL=2
CONFIG_PROSPECTOR_EXPECTED_PERIPHERAL_COUNT=2
CONFIG_PROSPECTOR_CHANNEL=0
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=1000
# One legacy HID/status advertiser and one independent Fight advertiser.
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2
CONFIG_ZMK_RUNTIME_TAPDANCE=y
CONFIG_ZMK_RUNTIME_TAPDANCE_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_TAPDANCE_MAX_TAPDANCES=16
CONFIG_ZMK_RUNTIME_TAPDANCE_MAX_ACTIVE=8
CONFIG_ZMK_RUNTIME_TAPDANCE_POOL_BYTES=1024
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE=y
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=0
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=2
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=y
