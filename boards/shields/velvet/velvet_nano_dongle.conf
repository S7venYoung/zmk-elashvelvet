# Screenless Nano K is the USB-facing split central.
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768

CONFIG_ZMK_USB=y
CONFIG_BT_BAS=n

CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=6
CONFIG_BT_BUF_ACL_TX_COUNT=3
CONFIG_BT_BUF_EVT_RX_COUNT=6
CONFIG_BT_L2CAP_TX_BUF_COUNT=4
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# DYA Studio central features, tuned for the screenless nRF52833 receiver.
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y
CONFIG_ZMK_BATTERY_HISTORY=n
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=n
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS_IN_BINDINGS=y
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER=y
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y

CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
CONFIG_SETTINGS=y
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=128
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=128
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=128
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=16
CONFIG_ZMK_CUSTOM_SETTINGS_RECORD=n
CONFIG_ZMK_CUSTOM_SETTINGS_RPC_CONVERTERS=n
CONFIG_ZMK_CUSTOM_SETTINGS_ARRAY_VIEW_POOL_SIZE=8
CONFIG_ZMK_CUSTOM_SETTINGS_NOTIFICATION_QUEUE_SIZE=4
CONFIG_ZMK_CUSTOM_SETTINGS_RELAY_REQUEST_QUEUE_SIZE=2
CONFIG_ZMK_CUSTOM_SETTINGS_RELAY_NOTIFICATION_QUEUE_SIZE=2
CONFIG_ZMK_FAST_KEYMAP_FP_CACHE=n
CONFIG_ZMK_RUNTIME_MACRO_COUNT=4
CONFIG_ZMK_RUNTIME_MACRO_POOL_BYTES=512
CONFIG_ZMK_RUNTIME_MACRO_MAX_BYTES=128
CONFIG_ZMK_RUNTIME_COMBO_MAX_COMBOS=4
CONFIG_ZMK_RUNTIME_COMBO_MAX_POSITIONS_PER_COMBO=8

# Nano K has no display; exclude display-only globals from velvet.conf.
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_ZMK_BACKLIGHT=n
CONFIG_LVGL=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_26=n
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT_BUF_EVT_RX_COUNT=33

# No keys: two short USB replug cycles enter the UF2 bootloader.
CONFIG_VELVET_NANO_REPLUG_BOOTLOADER=y
