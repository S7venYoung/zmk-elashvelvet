# Prospector is the USB-facing split central; keyboard halves are peripherals.
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768

# USB HID keyboard and Prospector screen.
CONFIG_ZMK_DISPLAY=y
CONFIG_SPI=y
CONFIG_BT_BAS=n
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_LV_Z_MEM_POOL_SIZE=49152
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Prospector touch controller.
CONFIG_INPUT=y
CONFIG_INPUT_CST816S=y
CONFIG_INPUT_CST816S_INTERRUPT=y
CONFIG_INPUT_CST816S_EV_DEVICE=y

CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=60
CONFIG_PROSPECTOR_LAYER_ROLLER_ALL_CAPS=n
CONFIG_PROSPECTOR_ROTATE_DISPLAY_180=n

# BLE capacity for two halves and host profiles.
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=6
CONFIG_BT_BUF_ACL_TX_COUNT=3
CONFIG_BT_BUF_EVT_RX_COUNT=6
CONFIG_BT_L2CAP_TX_BUF_COUNT=4
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# Retain the regular ZMK Studio USB interface from the existing Velvet setup.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# The WALLE theme's layer selector uses the LVGL roller widget.
CONFIG_LV_USE_ROLLER=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_BAR=y

# Keep central-side DYA and display features within the XIAO's RAM budget.
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=32
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=2048
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
CONFIG_ZMK_CUSTOM_SETTINGS_RECORD=n
CONFIG_ZMK_CUSTOM_SETTINGS_RPC_CONVERTERS=n
CONFIG_ZMK_CUSTOM_SETTINGS_ARRAY_VIEW_POOL_SIZE=8
CONFIG_ZMK_CUSTOM_SETTINGS_NOTIFICATION_QUEUE_SIZE=4
CONFIG_ZMK_CUSTOM_SETTINGS_RELAY_REQUEST_QUEUE_SIZE=2
CONFIG_ZMK_CUSTOM_SETTINGS_RELAY_NOTIFICATION_QUEUE_SIZE=2
CONFIG_ZMK_FAST_KEYMAP_FP_CACHE=n
CONFIG_ZMK_RUNTIME_MACRO_COUNT=4
CONFIG_ZMK_RUNTIME_MACRO_POOL_BYTES=512
CONFIG_ZMK_RUNTIME_MACRO_MAX_BYTES=128
CONFIG_ZMK_RUNTIME_COMBO_MAX_COMBOS=4
CONFIG_ZMK_RUNTIME_COMBO_MAX_POSITIONS_PER_COMBO=8
