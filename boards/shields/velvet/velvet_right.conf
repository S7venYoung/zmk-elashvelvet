CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_26=y
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_VIEW_WIDGET_STATUS=n
CONFIG_VELVET_CAT_DISPLAY=y
CONFIG_ZMK_BLE=y
CONFIG_SPI=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
CONFIG_SETTINGS=y

# Service memory-LCD VCOM independently from UI state changes.
CONFIG_LS0XX_VCOM_THREAD_PRIO=11

# Dynamic L8 image is repainted directly; never retain a decoded image cache.
CONFIG_LV_CACHE_DEF_SIZE=0
CONFIG_LV_DRAW_SW_SUPPORT_L8=y

# Velvet hardware control: main uses PWM P1.13 for peripheral power/control.
# This is separate from EXT_POWER P0.13 and must not be removed as RGB support.
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_BACKLIGHT_ON_START=y
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n
