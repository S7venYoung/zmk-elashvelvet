CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
# Custom display event names are longer than the ZMK default of 4 bytes.
CONFIG_ZMK_SPLIT_RELAY_EVENT_TYPE_NAME_LEN=32
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
CONFIG_SETTINGS=y

# Publish each physical half's own battery and WPM over the split relay.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_BT_BAS=y
