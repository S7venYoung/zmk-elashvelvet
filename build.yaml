# This file generates the GitHub Actions matrix
---
include:
  - board: xiao_ble//zmk
    shield: velvet_prospector_dongle prospector_adapter prospector_theme_walle velvet_dya_central
    cmake-args: -DCONFIG_LV_Z_MEM_POOL_SIZE=2048 -DCONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=8 -DCONFIG_ZMK_MAIN_THREAD_STACK_SIZE=4096 -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=2048 -DCONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048 -DCONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048 -DCONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=2048 -DCONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=64 -DCONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=64 -DCONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=64 -DCONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=64
    artifact: velvet_prospector_dongle_walle
  - board: nice_nano//zmk
    shield: velvet_left nice_view_custom velvet_prospector_peripheral
    cmake-args: -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
    artifact: velvet_left_dongle
  - board: nice_nano//zmk
    shield: velvet_right nice_view velvet_prospector_peripheral
    cmake-args: -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
    artifact: velvet_right_dongle
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact: settings_reset_xiao
  - board: nice_nano//zmk
    shield: velvet_left nice_view_custom
    cmake-args: -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
    artifact: velvet_left
  - board: nice_nano//zmk
    shield: velvet_right nice_view velvet_dya_central
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
    artifact: velvet_right
  - board: nice_nano//zmk
    shield: settings_reset
    artifact: settings_reset
