# This file generates the GitHub Actions matrix
---
include:
  - board: xiao_ble//zmk
    shield: velvet_prospector_dongle prospector_adapter prospector_theme_walle velvet_dya_central
    cmake-args: -DCONFIG_LV_Z_MEM_POOL_SIZE=49152 -DCONFIG_MAIN_STACK_SIZE=4096 -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192 -DCONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096 -DCONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096 -DCONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000 -DCONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256 -DCONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256 -DCONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256 -DCONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256 -DCONFIG_ZMK_RUNTIME_MACRO_MAX_BYTES=128 -DCONFIG_BT_BUF_ACL_TX_COUNT=3 -DCONFIG_BT_BUF_EVT_RX_COUNT=6 -DCONFIG_BT_L2CAP_TX_BUF_COUNT=4
