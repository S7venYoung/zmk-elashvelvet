# This file generates the GitHub Actions matrix
---
include:
  - board: nice_nano//zmk
    shield: velvet_nano_dongle dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256 -DCONFIG_ZMK_DISPLAY=y -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y -DCONFIG_ZMK_BACKLIGHT=n -DCONFIG_LV_Z_MEM_POOL_SIZE=9216 -DCONFIG_LV_Z_VDB_SIZE=25 -DCONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000 -DCONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256 -DCONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256 -DCONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
    artifact: velvet_nano_dongle_fight
  - board: nice_nano//zmk
    shield: velvet_left nice_view_custom velvet_split_peripheral
    cmake-args: -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y -DCONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
    artifact: velvet_left_dongle
  - board: nice_nano//zmk
    shield: velvet_right nice_view velvet_split_peripheral
    cmake-args: -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y -DCONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
    artifact: velvet_right_dongle
  - board: nice_nano//zmk
    shield: settings_reset
    artifact: settings_reset
