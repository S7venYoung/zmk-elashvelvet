# This file generates the GitHub Actions matrix
---
include:
  - board: nice_nano_k/nrf52833
    shield: velvet_nano_dongle
    cmake-args: -DCONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256 -DCONFIG_ZMK_DISPLAY=n
    artifact: velvet_nano_dongle
  - board: nice_nano//zmk
    shield: velvet_left nice_view_custom velvet_split_peripheral
    cmake-args: -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y -DCONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
    artifact: velvet_left_dongle
  - board: nice_nano//zmk
    shield: velvet_right nice_view velvet_split_peripheral
    cmake-args: -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y -DCONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
    artifact: velvet_right_dongle
  - board: nice_nano_k/nrf52833
    shield: settings_reset
    artifact: settings_reset_nano
  - board: nice_nano//zmk
    shield: velvet_left nice_view_custom
    cmake-args: -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
    artifact: velvet_left
  - board: nice_nano//zmk
    shield: velvet_right nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
    artifact: velvet_right
  - board: nice_nano//zmk
    shield: settings_reset
    artifact: settings_reset
