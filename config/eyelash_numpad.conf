CONFIG_ZMK_KEYBOARD_NAME="Velvet Numpad"
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_BT_MAX_CONN=1
# Leave room for existing standalone bonds during migration; never clear on boot.
CONFIG_BT_MAX_PAIRED=4
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n
CONFIG_ZMK_SLEEP=y
# Keep sparse numpad use connected; deep sleep still saves power after two hours.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_BT_BAS=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS_IN_BINDINGS=y
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_POINTING=n
CONFIG_ZMK_SPLIT_RELAY_EVENT=n
CONFIG_ZMK_CUSTOM_SETTINGS=n
CONFIG_ZMK_SETTINGS_RPC=n
CONFIG_ZMK_DEVICE_INFO=n
CONFIG_ZMK_RUNTIME_MACRO=n
CONFIG_ZMK_RUNTIME_TAPDANCE=n
CONFIG_ZMK_RUNTIME_COMBO=n
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_LOG=n
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LTO=y
CONFIG_ASSERT=y
CONFIG_STACK_SENTINEL=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
