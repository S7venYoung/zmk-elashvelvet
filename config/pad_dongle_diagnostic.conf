# Temporary USB connection diagnostics. Keep normal keymap, storage and bonds.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOG_LEVEL=1
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_LOG_MAX_LEVEL=3
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
# Two independent CDC ports: Studio plus the zmk-usb-logging snippet.
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=512
CONFIG_LOG_BACKEND_UART=y
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n
CONFIG_ZMK_SETTINGS_RESET_ON_START=n
CONFIG_VELVET_PAD_LINK_DIAGNOSTICS=y
